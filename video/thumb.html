<!doctype html><html><head><meta charset="utf-8"><style>
/* The app's LOCKED type system (fonts/fonts.css): Hanken = body/UI, Sono = spelling
   tiles, one display face per world. The thumbnail obeys it: Fraunces for the display
   line, Sono for anything that is a SPELLED word, Hanken for the label. */
@font-face{font-family:Fraunces;src:url('file:///home/user/Bizzing-Bee/spellbound-app/fonts/fraunces-800.woff2') format('woff2');font-weight:400 900}
@font-face{font-family:Sono;src:url('file:///home/user/Bizzing-Bee/spellbound-app/fonts/sono-600.woff2') format('woff2');font-weight:400 800}
@font-face{font-family:Hanken;src:url('file:///home/user/Bizzing-Bee/spellbound-app/fonts/hanken-var.woff2') format('woff2-variations');font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:#0d0a18}
.t{position:relative;width:1280px;height:720px;overflow:hidden}

/* REAL PHOTOGRAPH: the nine finalists of the 1925 National Spelling Bee with President
   Coolidge. Library of Congress, public domain. Actual children, actual bee. */
.ph{position:absolute;inset:0}
.ph img{width:100%;height:100%;object-fit:cover;object-position:50% 34%;
        filter:contrast(1.12) brightness(1.06) sepia(.16)}
/* Warm the photo towards the app's honey rather than leaving it cold grey */
.tone{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,194,61,.10),rgba(40,22,8,.30));mix-blend-mode:multiply;z-index:2}
/* Legibility only where the type sits — the brief's rule about not dimming the whole frame */
.scrim{position:absolute;left:0;right:0;bottom:0;height:56%;z-index:3;
       background:linear-gradient(180deg,transparent,rgba(12,8,20,.62) 42%,rgba(12,8,20,.93))}
.top{position:absolute;left:0;right:0;top:0;height:22%;z-index:3;
     background:linear-gradient(180deg,rgba(12,8,20,.80),transparent)}

.label{position:absolute;top:30px;left:0;right:0;z-index:6;text-align:center;
  font:800 27px Hanken;letter-spacing:.2em;text-transform:uppercase;color:#FFD873}
.mid{position:absolute;left:0;right:0;bottom:196px;z-index:6;text-align:center;
  font:900 116px Fraunces,serif;color:#fff;line-height:.98;
  text-shadow:0 6px 30px rgba(0,0,0,.85),0 2px 5px rgba(0,0,0,.9)}
.mid em{font-style:normal;color:#FFC23D}
/* SONO — the app sets spelled letters in Sono, so the year does too */
.yr{position:absolute;left:0;right:0;bottom:78px;z-index:6;text-align:center;
  font:800 96px Sono,ui-monospace,monospace;letter-spacing:.16em;color:#FFC23D;
  text-shadow:0 5px 24px rgba(0,0,0,.8)}
.brand{position:absolute;right:34px;bottom:26px;z-index:7;font:800 30px Fraunces,serif;color:#fff;opacity:.9}
.brand i{font-style:italic}
</style></head><body>
<div class="t">
  <div class="ph"><img src="file:///home/user/Bizzing-Bee/video/images/spelling-bee-1925-finalists-coolidge-loc.jpg"></div>
  <div class="tone"></div><div class="top"></div><div class="scrim"></div>
  <div class="label">America&rsquo;s first spelling bee</div>
  <div class="mid">It wasn&rsquo;t <em>these</em> kids.</div>
  <div class="yr">1908</div>
  <div class="brand"><i>Bizzing</i> Bee</div>
</div></body></html>
