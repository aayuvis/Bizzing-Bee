<!doctype html><html><head><meta charset="utf-8"><style>
/* App's locked type system: Fraunces = display, Sono = spelled letters, Hanken = UI. */
@font-face{font-family:Fraunces;src:url('file:///home/user/Bizzing-Bee/spellbound-app/fonts/fraunces-800.woff2') format('woff2');font-weight:400 900}
@font-face{font-family:Sono;src:url('file:///home/user/Bizzing-Bee/spellbound-app/fonts/sono-600.woff2') format('woff2');font-weight:400 800}
@font-face{font-family:Hanken;src:url('file:///home/user/Bizzing-Bee/spellbound-app/fonts/hanken-var.woff2') format('woff2-variations');font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden}
.t{position:relative;width:1280px;height:720px;overflow:hidden;
   background:radial-gradient(120% 100% at 22% 20%,#3A2A72,#241A56 55%,#150F30)}
.hex{position:absolute;inset:0;opacity:.30;z-index:1;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='52' height='90'><g fill='none' stroke='%23FFD873' stroke-opacity='0.55' stroke-width='2'><path d='M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z'/><path d='M52,-30 L78,-15 L78,15 L52,30 L26,15 L26,-15 Z'/><path d='M26,15 L52,30 L52,60 L26,75 L0,60 L0,30 Z'/><path d='M0,60 L26,75 L26,105 L0,120 L-26,105 L-26,75 Z'/><path d='M52,60 L78,75 L78,105 L52,120 L26,105 L26,75 Z'/></g></svg>")}

/* The photograph SUPPORTS: a framed print on the right, tilted, not the ground of the
   image. Cropped inside the mount so the scan's black border and typed caption -- which
   is where the 1926 date lives -- never appear. */
.photo{position:absolute;right:-26px;top:96px;width:560px;height:400px;z-index:3;
  transform:rotate(3deg);box-shadow:0 26px 60px rgba(0,0,0,.62);border:9px solid #F3EEE2;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 42%;filter:contrast(1.1) sepia(.12)}
.credit{position:absolute;right:26px;top:512px;z-index:4;font:700 17px Hanken;color:#C9BEE8;opacity:.8;
  transform:rotate(3deg)}

.wrap{position:absolute;left:62px;top:0;bottom:0;width:700px;z-index:5;display:flex;flex-direction:column;justify-content:center}
.kick{font:800 30px Hanken;white-space:nowrap;letter-spacing:.2em;text-transform:uppercase;color:#FFD873;margin-bottom:10px}
.y25{position:relative;display:inline-block;font:900 104px Fraunces,serif;color:#fff;opacity:.42;line-height:1}
.y25:after{content:'';position:absolute;left:-10px;right:-10px;top:50%;height:12px;background:#E0483C;
  transform:rotate(-6deg);border-radius:3px}
.y08{font:800 236px Sono,ui-monospace,monospace;color:#FFC23D;line-height:.94;letter-spacing:.03em;
  text-shadow:0 12px 40px rgba(0,0,0,.6)}
.sub{font:900 62px Fraunces,serif;color:#fff;margin-top:6px}
.sub em{font-style:normal;color:#FFD873}
.brand{position:absolute;left:62px;bottom:34px;z-index:6;font:800 30px Fraunces,serif;color:#fff;opacity:.85}
.brand i{font-style:italic}
</style></head><body>
<div class="t">
  <div class="hex"></div>
  <div class="photo"><img src="file:///home/user/Bizzing-Bee/video/images/spelling-bee-1926-finalists-CROP.jpg"></div>
  <div class="credit">National Spelling Bee, 1926</div>
  <div class="wrap">
    <div class="kick">The first spelling bee was not</div>
    <div><span class="y25">1925</span></div>
    <div class="y08">1908</div>
    <div class="sub">She was <em>13</em>.</div>
  </div>
  <div class="brand"><i>Bizzing</i> Bee</div>
</div></body></html>
